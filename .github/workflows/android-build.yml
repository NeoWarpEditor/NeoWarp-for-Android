name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # capacitor.settings.gradle 引用 ../node_modules/@capacitor/android/capacitor，
      # 因此 npm ci 必须在仓库根执行（仓库根即 android-app 工程根）。
      - name: Install Capacitor dependencies
        run: npm ci

      - name: Prepare web assets (www)
        run: |
          if [ -f www/index.html ] && [ -d www/editor ]; then
            echo "www 产物已随仓库提交，跳过构建"
          elif [ -f prepare-www.py ] && [ -d dist-renderer-webpack ] && [ -d src-renderer ]; then
            python3 prepare-www.py
          else
            echo "::error::www 产物缺失，且仓库中找不到桌面版构建产物"
            exit 1
          fi

      # assets/www 被 .gitignore 排除，由本步骤从 www/ 复制生成。
      - name: Copy www into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r www android/app/src/main/assets/www

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoWarp-0.0.1-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
