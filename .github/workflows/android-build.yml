name: Android Build

on:
  push:
    branches: [ feature/android ]
  pull_request:
    branches: [ feature/android ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm ci

      - name: Prepare web assets (www)
        working-directory: android-app
        run: |
          if [ -f www/index.html ] && [ -d www/editor ]; then
            echo "www 产物已随仓库提交，跳过构建"
          elif [ -f prepare-www.py ] && [ -d ../dist-renderer-webpack ] && [ -d ../src-renderer ]; then
            python3 prepare-www.py
          else
            echo "::error::www 产物缺失，且仓库中找不到桌面版构建产物（dist-renderer-webpack / src-renderer 等）"
            exit 1
          fi

      - name: Copy www into Android assets
        working-directory: android-app
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r www android/app/src/main/assets/www

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoWarp-2.0.0-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
